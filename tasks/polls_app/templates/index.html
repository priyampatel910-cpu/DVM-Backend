{% extends "layout.html" %}

{% block body %}
 
<h1>Available Polls</h1>
    {% if questions %}
        <ul>
        {% for question in questions %}
            <li><a href="{% url 'polls:details' question.id %}">{{ question.question_text }}</a></li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No polls are available.</p>
    {% endif %}

{% endblock %}
