{%extends "layout.html"%}
{% block body %}
    <h1>{{ question.question_text }}</h1>
    <ul>
        {%for choice in choices %}
            <li>
                {{ choice.choice_text }}
                -
                {{choice.votes}} vote(s)
            </li>
        {% endfor %}
    </ul>
    <a href="{% url 'polls:detail' question.id %}">Vote again</a>
{% endblock %}
