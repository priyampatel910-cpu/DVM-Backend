{% extends "layout.html" %}

{% block body %}
    <h1>{{ question.question_text }}</h1>
        <form method="post">
            {% csrf_token %}
            {% for choice in choices %}
                
                <input type="radio" name="choice" value="{{ choice.id }}">
                {{ choice.choice_text }}
                <br>
            {% endfor %}
            <br>
            <button type="submit">Vote</button>
        </form>
        <br>
        <a href="{% url 'polls:results' question.id %}">View Results</a>
{% endblock %}
